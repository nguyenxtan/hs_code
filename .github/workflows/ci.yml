name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run test:data
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # Full-data and browser checks require the source snapshot; it is not redistributed in Git.
